name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated:
    name: generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: GraphQL types are up to date
        run: pnpm --filter @handoff/github codegen && git diff --exit-code packages/github/src/gql
      - name: The Claude Code plugin's bundled bridge is up to date
        run: pnpm build:plugin && git diff --exit-code plugins/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  react-doctor:
    name: react doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx -y react-doctor@latest . --yes --no-telemetry --blocking error
        working-directory: apps/web

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @handoff/web build

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:web

  # Integration files run one at a time against one database, so each shard gets its own Postgres.
  integration:
    name: integration ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: handoff
          POSTGRES_PASSWORD: handoff
          POSTGRES_DB: handoff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handoff -d handoff_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://handoff:handoff@localhost:5432/handoff_test
      HANDOFF_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: docker pull node:22-alpine
      - run: pnpm vitest run --project integration --shard=${{ matrix.shard }}/4

  # The one check the main branch ruleset requires: it passes only when every job above passed.
  test:
    if: always()
    needs: [generated, typecheck, lint, react-doctor, build, unit, web, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
