fragment PlanDateFields on ProjectV2 {
  start: field(name: "Start") {
    __typename
    ... on ProjectV2Field {
      id
      dataType
    }
  }
  target: field(name: "Target") {
    __typename
    ... on ProjectV2Field {
      id
      dataType
    }
  }
}

# A Project without Size or Estimate answers each lookup with a NOT_FOUND error next to complete data.
fragment PlanEstimateFields on ProjectV2 {
  size: field(name: "Size") {
    __typename
    ... on ProjectV2SingleSelectField {
      id
      options {
        id
        name
        color
        description
      }
    }
  }
  estimate: field(name: "Estimate") {
    __typename
    ... on ProjectV2Field {
      id
      dataType
    }
  }
}

# The repository and its owner, a user or an organization, under whom setup creates the plan's Project.
query PlanOwnerIds($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    id
    owner {
      __typename
      id
      ... on User {
        viewerCanCreateProjects
      }
      ... on Organization {
        viewerCanCreateProjects
      }
    }
  }
}

fragment PlanProjectChoice on ProjectV2 {
  id
  number
  title
  url
  closed
  ...PlanDateFields
  ...PlanEstimateFields
  field(name: "Status") {
    __typename
    ... on ProjectV2SingleSelectField {
      id
      options {
        id
        name
        color
        description
      }
    }
  }
  repositories(first: 50) {
    nodes {
      id
      name
      owner {
        login
      }
    }
  }
}

# The Project reads below take the repository owner's login, a user's or an organization's, and read
# either owner's Projects in one request; __typename says which owns them.

# Only Projects the token can write: an organization may have many that setup could not use.
query PlanProjects($login: String!) {
  repositoryOwner(login: $login) {
    __typename
    ... on ProjectV2Owner {
      projectsV2(first: 100, minPermissionLevel: WRITE, orderBy: { field: UPDATED_AT, direction: DESC }) {
        nodes {
          ...PlanProjectChoice
        }
      }
    }
  }
}

query PlanProjectSetup($login: String!, $number: Int!) {
  repositoryOwner(login: $login) {
    __typename
    ... on ProjectV2Owner {
      projectV2(number: $number) {
        ...PlanProjectChoice
      }
    }
  }
}

query PlanProject($login: String!, $number: Int!) {
  repositoryOwner(login: $login) {
    __typename
    # An organization's Priority issue field orders the plan when the Project has no Priority field of its own.
    ... on Organization {
      issueFields(first: 25) {
        nodes {
          __typename
          ... on IssueFieldSingleSelect {
            name
            options {
              name
              priority
            }
          }
        }
      }
    }
    ... on ProjectV2Owner {
      projectV2(number: $number) {
        id
        number
        url
        title
        ...PlanDateFields
        ...PlanEstimateFields
        field(name: "Status") {
          __typename
          ... on ProjectV2SingleSelectField {
            id
            options {
              id
              name
            }
          }
        }
        # A Project without a Priority field answers with a NOT_FOUND error for this lookup, next to complete data.
        priority: field(name: "Priority") {
          __typename
          ... on ProjectV2SingleSelectField {
            # True for a column that shows the organization's issue field rather than a field of the Project's own.
            isIssueField
            options {
              name
            }
          }
        }
      }
    }
  }
}
