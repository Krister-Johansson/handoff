fragment PlanDateFields on ProjectV2 {
  start: field(name: "Start") {
    __typename
    ... on ProjectV2Field {
      id
      dataType
    }
  }
  target: field(name: "Target") {
    __typename
    ... on ProjectV2Field {
      id
      dataType
    }
  }
}

# A Project without Size or Estimate answers each lookup with a NOT_FOUND error next to complete data.
fragment PlanEstimateFields on ProjectV2 {
  size: field(name: "Size") {
    __typename
    ... on ProjectV2SingleSelectField {
      id
      options {
        id
        name
        color
        description
      }
    }
  }
  estimate: field(name: "Estimate") {
    __typename
    ... on ProjectV2Field {
      id
      dataType
    }
  }
}

query PlanOwnerIds($login: String!, $owner: String!, $name: String!) {
  user(login: $login) {
    id
  }
  repository(owner: $owner, name: $name) {
    id
  }
}

fragment PlanProjectChoice on ProjectV2 {
  id
  number
  title
  url
  closed
  ...PlanDateFields
  ...PlanEstimateFields
  field(name: "Status") {
    __typename
    ... on ProjectV2SingleSelectField {
      id
      options {
        id
        name
        color
        description
      }
    }
  }
  repositories(first: 50) {
    nodes {
      id
      name
      owner {
        login
      }
    }
  }
}

query PlanProjects($login: String!) {
  user(login: $login) {
    projectsV2(first: 100, orderBy: { field: UPDATED_AT, direction: DESC }) {
      nodes {
        ...PlanProjectChoice
      }
    }
  }
}

query PlanProjectSetup($login: String!, $number: Int!) {
  user(login: $login) {
    projectV2(number: $number) {
      ...PlanProjectChoice
    }
  }
}

query PlanProject($login: String!, $number: Int!) {
  user(login: $login) {
    projectV2(number: $number) {
      id
      number
      url
      title
      ...PlanDateFields
      ...PlanEstimateFields
      field(name: "Status") {
        __typename
        ... on ProjectV2SingleSelectField {
          id
          options {
            id
            name
          }
        }
      }
      # A Project without a Priority field answers with a NOT_FOUND error for this lookup, next to complete data.
      priority: field(name: "Priority") {
        __typename
        ... on ProjectV2SingleSelectField {
          options {
            name
          }
        }
      }
    }
  }
}
