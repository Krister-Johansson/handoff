# An issue's parent and grandparent with what tells their kind. Sub-issues are a GitHub issue
# feature, so this needs no Project access.
fragment IssueAncestors on Issue {
  parent {
    number
    title
    body
    labels(first: 20) {
      nodes {
        name
      }
    }
    issueType {
      name
    }
    parent {
      number
      title
      body
      labels(first: 20) {
        nodes {
          name
        }
      }
      issueType {
        name
      }
      # Three more ancestors are enough to tell each kind's depth, which stops counting at three.
      parent {
        number
        parent {
          number
          parent {
            number
          }
        }
      }
    }
  }
}

query IssueParents($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      ...IssueAncestors
    }
  }
}
