query PullRequestSnapshot($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      number
      title
      body
      isDraft
      additions
      deletions
      changedFiles
      updatedAt
      url
      headRefOid
      headRefName
      state
      merged
      mergeable
      reviewDecision
      commits(last: 1) {
        nodes {
          commit {
            statusCheckRollup {
              state
              contexts(first: 100) {
                nodes {
                  __typename
                  ... on CheckRun {
                    databaseId
                    name
                    status
                    conclusion
                    detailsUrl
                  }
                  ... on StatusContext {
                    context
                    state
                    targetUrl
                  }
                }
              }
            }
          }
        }
      }
      reviews(last: 50) {
        nodes {
          databaseId
          state
          body
          submittedAt
          author {
            __typename
            login
          }
          commit {
            oid
          }
        }
      }
      reviewThreads(first: 100) {
        nodes {
          id
          isResolved
          isOutdated
          path
          line
          originalLine
          viewerCanReply
          viewerCanResolve
          resolvedBy {
            login
          }
          comments(first: 1) {
            nodes {
              ...ThreadComment
            }
          }
          latest: comments(last: 10) {
            nodes {
              ...ThreadComment
            }
          }
        }
      }
      comments(last: 50) {
        nodes {
          databaseId
          author {
            __typename
            login
          }
          body
          url
          createdAt
          updatedAt
        }
      }
    }
  }
}

fragment ThreadComment on PullRequestReviewComment {
  databaseId
  author {
    __typename
    login
  }
  body
  path
  line
  url
  createdAt
}
