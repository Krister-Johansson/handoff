query IssueNodeId($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      id
    }
  }
}

query IssueCreateRefs($owner: String!, $name: String!, $parent: Int!, $withParent: Boolean!) {
  repository(owner: $owner, name: $name) {
    id
    labels(first: 100) {
      nodes {
        id
        name
      }
    }
    parent: issue(number: $parent) @include(if: $withParent) {
      id
    }
  }
}

query IssuePlan($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    owner {
      id
    }
    issue(number: $number) {
      id
      number
      title
      body
      labels(first: 20) {
        nodes {
          name
        }
      }
      issueType {
        name
      }
      parent {
        number
        title
        body
        labels(first: 20) {
          nodes {
            name
          }
        }
        issueType {
          name
        }
        parent {
          number
          title
          body
          labels(first: 20) {
            nodes {
              name
            }
          }
          issueType {
            name
          }
          # Three more ancestors are enough to tell each kind's depth, which stops counting at three.
          parent {
            number
            parent {
              number
              parent {
                number
              }
            }
          }
        }
      }
      projectItems(first: 20) {
        nodes {
          id
          project {
            id
            number
            owner {
              id
            }
            field(name: "Status") {
              __typename
              ... on ProjectV2SingleSelectField {
                id
                options {
                  id
                  name
                }
              }
            }
          }
          status: fieldValueByName(name: "Status") {
            __typename
            ... on ProjectV2ItemFieldSingleSelectValue {
              name
            }
          }
        }
      }
    }
  }
}
